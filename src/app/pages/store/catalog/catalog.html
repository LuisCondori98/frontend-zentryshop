<div class="bg-gray-50 min-h-screen py-8 sm:py-12">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    
    <!-- Encabezado y Buscador -->
    <div class="mb-8 flex flex-col md:flex-row md:items-end justify-between gap-6">
      <div>
        <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">Nuestro Catálogo</h1>
        <p class="mt-2 text-slate-500 text-base sm:text-lg">Descubre los mejores productos de ZentryShop.</p>
      </div>
      
      <!-- Buscador -->
      <div class="relative w-full md:w-96">
        <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
          <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>
        <input type="text" [(ngModel)]="searchTerm" (input)="applyFilter()" placeholder="Buscar productos..." 
               class="w-full pl-10 pr-4 py-3 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-slate-900 outline-none shadow-sm text-sm">
      </div>
    </div>

    <div class="flex flex-col lg:flex-row gap-8">
      
      <!-- SIDEBAR DE FILTROS -->
      <aside class="w-full lg:w-64 flex-shrink-0">
        
        <!-- Botón para abrir filtros en móvil -->
        <button (click)="isMobileFilterOpen = !isMobileFilterOpen" class="lg:hidden w-full flex items-center justify-between bg-white px-4 py-3 rounded-xl shadow-sm border border-gray-200 mb-4 font-bold text-slate-900">
          <span class="flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
            Filtros
          </span>
          <svg [class.rotate-180]="isMobileFilterOpen" class="w-5 h-5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
        </button>

        <!-- Panel de filtros -->
        <div [ngClass]="isMobileFilterOpen ? 'block' : 'hidden lg:block'" class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 lg:sticky lg:top-24 space-y-4">
          
          <!-- Acordeón: Categorías -->
          <details class="group border-b border-gray-100 pb-4" open>
            <summary class="flex justify-between items-center font-bold text-slate-900 cursor-pointer list-none select-none">
              Categorías
              <span class="transition group-open:rotate-180">
                <svg fill="none" height="24" shape-rendering="geometricPrecision" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" viewBox="0 0 24 24" width="24"><path d="M6 9l6 6 6-6"></path></svg>
              </span>
            </summary>
            
            <div class="mt-3 space-y-3">
              <!-- Botón Todas -->
              <label class="flex items-center gap-3 cursor-pointer group/item">
                <input type="radio" name="category" [checked]="selectedCategory === null" (change)="filterByCategory(null)" 
                       class="w-4 h-4 text-slate-900 focus:ring-slate-900 border-gray-300">
                <span class="text-sm text-slate-600 group-hover/item:text-slate-900 font-medium">Todas las categorías</span>
              </label>
              
              <!-- Categorías dinámicas -->
              <label *ngFor="let cat of categories" class="flex items-center gap-3 cursor-pointer group/item">
                <input type="radio" name="category" [checked]="selectedCategory === cat.id" (change)="filterByCategory(cat.id)"
                       class="w-4 h-4 text-slate-900 focus:ring-slate-900 border-gray-300">
                <span class="text-sm text-slate-600 group-hover/item:text-slate-900">{{ cat.name }}</span>
              </label>
            </div>
          </details>

                    <!-- Acordeón: Promociones -->
          <details class="group pb-2" open>
            <summary class="flex justify-between items-center font-bold text-slate-900 cursor-pointer list-none select-none">
              Promociones
              <span class="transition group-open:rotate-180">
                <svg fill="none" height="24" shape-rendering="geometricPrecision" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" viewBox="0 0 24 24" width="24"><path d="M6 9l6 6 6-6"></path></svg>
              </span>
            </summary>
            <div class="mt-3 space-y-2">
              <label class="flex items-center gap-3 cursor-pointer group/item">
                <!-- 👇 Conectamos el checkbox a la variable y a la función 👇 -->
                <input type="checkbox" 
                       [(ngModel)]="onlyOffers" 
                       (change)="toggleOffersFilter()"
                       class="w-4 h-4 rounded text-red-600 focus:ring-red-600 border-gray-300 cursor-pointer">
                <span class="text-sm font-medium text-slate-600 group-hover/item:text-slate-900 cursor-pointer">Solo ofertas</span>
              </label>
            </div>
          </details>

        </div>
      </aside>

      <!-- CONTENIDO PRINCIPAL (GRID DE PRODUCTOS) -->
      <div class="flex-1">
        
        <div class="flex justify-between items-center mb-6">
          <span class="text-sm font-medium text-slate-500 bg-white px-3 py-1.5 rounded-lg shadow-sm border border-gray-200">
            Mostrando <strong class="text-slate-900">{{ filteredProducts.length }}</strong> productos
          </span>
        </div>

        <!-- Loader -->
        <div *ngIf="isLoading" class="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 sm:gap-6 animate-pulse">
          <div *ngFor="let i of [1,2,3,4,5,6,7,8]" class="bg-white rounded-2xl h-[350px] border border-gray-100"></div>
        </div>

        <!-- Grid de Productos -->
        <div *ngIf="!isLoading && filteredProducts.length > 0" class="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 sm:gap-6">
          
          <div *ngFor="let product of filteredProducts" class="group bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 border border-gray-100 flex flex-col">
            
            <!-- Imagen -->
            <div class="relative w-full h-40 sm:h-56 bg-gray-50 overflow-hidden">
              <img [src]="product.images[0]?.url || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?q=80&w=800&auto=format&fit=crop'" 
                   [alt]="product.name" 
                   class="w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-500">
              <div class="absolute top-2 right-2">
                <span *ngIf="product.isOnSale" class="bg-red-600 text-white px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider shadow-md">
                  Oferta
                </span>
              </div>
            </div>

            <!-- Contenido -->
            <div class="p-3 sm:p-4 flex-1 flex flex-col justify-between">
              <div>
                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">{{ product.category?.name || 'General' }}</span>
                <h3 class="text-sm sm:text-base font-bold text-slate-900 truncate leading-tight mt-0.5">{{ product.name }}</h3>
              </div>
              
              <div class="mt-3 flex items-end justify-between">
                <span class="text-base sm:text-lg font-black text-slate-900">S/ {{ product.price }}</span>
                <a [routerLink]="['/product', product.slug]" 
                   class="bg-slate-900 text-white px-3 py-1.5 sm:px-4 sm:py-2 rounded-lg font-bold hover:bg-slate-700 transition-colors shadow-sm text-xs sm:text-sm">
                  Ver
                </a>
              </div>
            </div>

          </div>

        </div>

        <!-- Sin productos -->
        <div *ngIf="!isLoading && filteredProducts.length === 0" class="text-center py-20 bg-white rounded-2xl border border-gray-100 shadow-sm">
          <svg class="mx-auto h-12 w-12 text-gray-300 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <p class="text-slate-500 text-lg">No se encontraron productos con esos filtros.</p>
        </div>
      </div>

    </div>
  </div>
</div>
