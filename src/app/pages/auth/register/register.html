<div class="min-h-screen flex bg-gray-50">
  
  <!-- Lado Izquierdo: Branding -->
  <div class="hidden lg:flex lg:w-5/12 bg-slate-900 justify-center items-center relative overflow-hidden">
    <div class="absolute inset-0 bg-gradient-to-br from-slate-800 to-slate-900 opacity-90"></div>
    
    <div class="relative z-10 text-center px-12">
      <h1 class="text-4xl font-bold text-white tracking-tight mb-4">Únete a ZentryShop</h1>
      <p class="text-slate-400 text-lg">Crea tu cuenta para gestionar tus compras y pedidos de manera rápida y segura.</p>
    </div>
  </div>

  <!-- Lado Derecho: Formulario -->
  <div class="w-full lg:w-7/12 flex items-center justify-center p-8 sm:p-12">
    <div class="w-full max-w-xl">
      
      <div class="text-center mb-8">
        <h2 class="text-3xl font-extrabold text-slate-900">Crear una cuenta</h2>
        <p class="text-sm text-slate-500 mt-2">Ingresa tus datos para registrarte en la plataforma.</p>
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-5">
        
        <!-- Fila 1: Nombre y Apellido -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Nombres</label>
            <input type="text" formControlName="firstName"
              class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-slate-900 focus:border-slate-900 outline-none transition-all text-slate-900"
              placeholder="Ej. Luis" />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Apellidos</label>
            <input type="text" formControlName="lastName"
              class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-slate-900 focus:border-slate-900 outline-none transition-all text-slate-900"
              placeholder="Ej. Pérez" />
          </div>
        </div>

        <!-- Fila 2: Documento y Teléfono -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div class="sm:col-span-1">
            <label class="block text-sm font-medium text-slate-700 mb-1">Tipo Doc.</label>
            <select formControlName="documentType"
              class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-slate-900 focus:border-slate-900 outline-none transition-all text-slate-900 bg-white">
              <option value="DNI">DNI</option>
              <option value="RUC">RUC</option>
              <option value="CE">CE</option>
            </select>
          </div>
          <div class="sm:col-span-2">
            <label class="block text-sm font-medium text-slate-700 mb-1">Número de Documento</label>
            <input type="text" formControlName="documentNumber"
              class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-slate-900 focus:border-slate-900 outline-none transition-all text-slate-900"
              placeholder="Ej. 12345678" />
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Teléfono Celular</label>
          <input type="tel" formControlName="phone"
            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-slate-900 focus:border-slate-900 outline-none transition-all text-slate-900"
            placeholder="Ej. 987654321" />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Correo Electrónico</label>
          <input type="email" formControlName="email"
            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-slate-900 focus:border-slate-900 outline-none transition-all text-slate-900"
            placeholder="ejemplo@correo.com" />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
          <input type="password" formControlName="password"
            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-slate-900 focus:border-slate-900 outline-none transition-all text-slate-900"
            placeholder="Mínimo 6 caracteres" />
        </div>

        <button type="submit" [disabled]="registerForm.invalid || isLoading"
          class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-slate-900 hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-900 disabled:opacity-50 disabled:cursor-not-allowed transition-colors mt-6">
          <span *ngIf="!isLoading">Registrarse</span>
          <span *ngIf="isLoading">Procesando...</span>
        </button>

        <div *ngIf="errorMessage" class="bg-red-50 text-red-600 p-3 rounded-lg text-sm text-center border border-red-100">
          {{ errorMessage }}
        </div>
        <div *ngIf="successMessage" class="bg-green-50 text-green-600 p-3 rounded-lg text-sm text-center border border-green-100">
          {{ successMessage }}
        </div>
      </form>

      <p class="mt-8 text-center text-sm text-slate-500">
        ¿Ya tienes una cuenta? 
        <a routerLink="/login" class="font-medium text-slate-900 hover:underline">Inicia sesión aquí</a>
      </p>

    </div>
  </div>
</div>
