<div class="max-w-7xl mx-auto pb-12">
  
  <div class="mb-8">
    <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Gestión de Categorías</h1>
    <p class="text-sm text-slate-500 mt-1">Organiza tus productos creando y editando categorías.</p>
  </div>

  <div class="flex flex-col lg:flex-row gap-8">
    
    <!-- FORMULARIO (Izquierda) -->
    <div class="w-full lg:w-1/3">
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 sticky top-24">
        <h2 class="text-lg font-bold text-slate-900 mb-4">{{ isEditing ? 'Editar Categoría' : 'Nueva Categoría' }}</h2>
        
        <form [formGroup]="categoryForm" (ngSubmit)="onSubmit()" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Nombre <span class="text-red-500">*</span></label>
            <input type="text" formControlName="name" placeholder="Ej: Zapatillas" 
                   class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-slate-900 outline-none">
          </div>
          
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Slug (URL) <span class="text-red-500">*</span></label>
            <input type="text" formControlName="slug" placeholder="Ej: zapatillas" 
                   class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-slate-900 outline-none">
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Descripción</label>
            <textarea formControlName="description" rows="2" placeholder="Breve descripción..."
                      class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-slate-900 outline-none"></textarea>
          </div>

          

          <div class="flex gap-2 pt-2">
            <button type="submit" [disabled]="categoryForm.invalid || isLoading" 
                    class="flex-1 bg-slate-900 text-white py-2.5 rounded-lg font-medium hover:bg-slate-800 transition-colors disabled:opacity-50">
              {{ isLoading ? 'Guardando...' : (isEditing ? 'Actualizar' : 'Crear Categoría') }}
            </button>
            <button type="button" *ngIf="isEditing" (click)="resetForm()" 
                    class="px-4 py-2.5 bg-gray-100 text-slate-600 rounded-lg font-medium hover:bg-gray-200 transition-colors">
              Cancelar
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- TABLA (Derecha) -->
    <div class="w-full lg:w-2/3">
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <div *ngIf="isLoadingList" class="p-12 text-center">
          <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-slate-200 border-t-slate-900"></div>
        </div>

        <table class="w-full text-left border-collapse" *ngIf="!isLoadingList">
          <thead>
            <tr class="bg-gray-50 text-slate-500 text-xs uppercase tracking-wider border-b border-gray-100">
              <th class="px-6 py-4 font-semibold">Categoría</th>
              <th class="px-6 py-4 font-semibold">Slug</th>
              <th class="px-6 py-4 font-semibold text-right">Acciones</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-100 text-sm">
            <tr *ngFor="let cat of categories" class="hover:bg-gray-50 transition-colors">
              <td class="px-6 py-4">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 rounded-lg bg-gray-100 overflow-hidden flex-shrink-0">
                    <img *ngIf="cat.imageUrl" [src]="cat.imageUrl" class="w-full h-full object-cover">
                  </div>
                  <div>
                    <div class="font-bold text-slate-900">{{ cat.name }}</div>
                    <div class="text-xs text-slate-500 truncate max-w-[200px]">{{ cat.description || 'Sin descripción' }}</div>
                  </div>
                </div>
              </td>
              <td class="px-6 py-4 text-slate-500 font-mono text-xs">/{{ cat.slug }}</td>
              <td class="px-6 py-4 text-right">
                <button (click)="editCategory(cat)" class="text-slate-400 hover:text-slate-900 transition-colors p-2" title="Editar">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                </button>
                <button (click)="deleteCategory(cat.id)" class="text-red-400 hover:text-red-600 transition-colors p-2 ml-1" title="Eliminar">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
              </td>
            </tr>
            <tr *ngIf="categories.length === 0">
              <td colspan="3" class="px-6 py-8 text-center text-slate-500">No hay categorías creadas aún.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>
